<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROPE — Reality of Physics Education</title>
<meta name="description" content="ROPE is an interactive physics laboratory for exploring motion, waves, collisions, oscillations and gravity.">
<meta name="theme-color" content="#0b0b10">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.17/dist/lil-gui.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  /* ROPE-RESKIN-2026 */
  --bg-deep: #0b0b10;
  --bg-panel: rgba(19, 19, 28, 0.98);
  --border: rgba(205, 202, 230, 0.12);
  --border-hi: rgba(167, 153, 230, 0.38);
  --cyan: #b4a5f5;
  --lime: #b9c9a3;
  --orange: #e5ad82;
  --purple: #b4a5f5;
  --text: #f0eff7;
  --muted: rgba(240, 239, 247, 0.68);
  --dim: rgba(240, 239, 247, 0.40);
  --bg-deep:    #04070e;
  --bg-panel:   rgba(6,12,24,0.97);
  --border:     rgba(255,255,255,0.07);
  --border-hi:  rgba(99,202,255,0.28);
  --cyan:       #63caff;
  --lime:       #a8ff78;
  --orange:     #ff9f45;
  --purple:     #c084fc;
  --text:       #e8f0fe;
  --muted:      rgba(232,240,254,0.50);
  --dim:        rgba(232,240,254,0.25);
  --mono:       'Space Mono', monospace;
  --ui:         'Syne', sans-serif;
  --touch-sm:   56px;
  --touch-md:   64px;
  --touch-lg:   72px;
  --topbar-h:   72px;
  --radius:     14px;
  --radius-sm:  8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:var(--bg-deep);
  color:var(--text);
  font-family:var(--ui);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
#bg-particles{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;width:100vw;height:100vh;overflow:hidden}
#canvas-container{position:absolute;inset:0; touch-action:none;}

/* TOP BAR */
#top-bar{
  position:absolute;top:0;left:0;right:0;
  height:var(--topbar-h);
  display:flex;align-items:center;
  padding:0 28px;gap:14px;
  background:linear-gradient(180deg,rgba(4,7,14,.96) 0%,transparent 100%);
  z-index:100;pointer-events:none;
}
.tb-logo{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:2px;display:flex;align-items:center;gap:9px}
.tb-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.tb-div{width:1px;height:28px;background:var(--border)}
#sim-title{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--text)}
#sim-subtitle{font-family:var(--mono);font-size:11px;color:var(--muted);padding:3px 12px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:100px}
#view-badge{pointer-events:all;font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:4px 12px;border-radius:100px;background:rgba(168,255,120,.15);border:1px solid rgba(168,255,120,.3);color:var(--lime);cursor:default}
#view-badge.mode-3d{background:rgba(192,132,252,.15);border-color:rgba(192,132,252,.3);color:var(--purple)}
#mode-badge{
  margin-left:auto;pointer-events:all;
  display:flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:100px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);
  font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);cursor:pointer;transition:all .2s;
}
#mode-badge.student{background:rgba(168,255,120,.1);border-color:rgba(168,255,120,.3);color:var(--lime)}
#mode-badge:active{transform:scale(.95)}

#pause-indicator{position:absolute;top:calc(var(--topbar-h)+16px);left:50%;transform:translateX(-50%);background:var(--orange);color:#000;font-family:var(--mono);font-size:13px;font-weight:700;padding:10px 28px;border-radius:100px;z-index:120;display:none;box-shadow:0 0 28px rgba(255,159,69,.55),0 4px 16px rgba(0,0,0,.4);letter-spacing:2px;text-transform:uppercase}

.rh{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.18);transform:scale(0);animation:rp .55s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}

/* FAB CLUSTER */
#fab-cluster{position:absolute;bottom:32px;right:32px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.fab{border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .2s,box-shadow .2s}
.fab:active{transform:scale(.91)}
.fab-main{width:var(--touch-lg);height:var(--touch-lg);font-size:22px;background:var(--cyan);color:#04070e;box-shadow:0 6px 24px rgba(99,202,255,.45),0 2px 8px rgba(0,0,0,.5)}
.fab-main.open{background:rgba(99,202,255,.12);color:var(--cyan);border:1.5px solid var(--cyan);box-shadow:0 0 0 4px rgba(99,202,255,.12)}
.fab-sec{width:var(--touch-sm);height:var(--touch-sm);font-size:18px;background:var(--bg-panel);border:1px solid var(--border);color:var(--muted);box-shadow:0 4px 16px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translateY(16px) scale(.85);transition:opacity .22s,transform .22s,background .15s,color .15s,border-color .15s}
.fab-sec.vis{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.fab-sec:active{transform:scale(.9)!important}
.fab-sec.on{background:rgba(99,202,255,.12);color:var(--cyan);border-color:rgba(99,202,255,.35)}
.fab-sec.paused{background:rgba(255,159,69,.12);color:var(--orange);border-color:rgba(255,159,69,.35)}
.fab-sec.ghost-on{background:rgba(168,255,120,.12);color:var(--lime);border-color:rgba(168,255,120,.35)}
.fab-row{display:flex;align-items:center;gap:12px}
.fab-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg-panel);border:1px solid var(--border);padding:5px 12px;border-radius:100px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.fab-row.vis .fab-lbl{opacity:1}
.fab-row:nth-child(1) .fab-sec{transition-delay:.04s}
.fab-row:nth-child(2) .fab-sec{transition-delay:.08s}
.fab-row:nth-child(3) .fab-sec{transition-delay:.12s}
.fab-row:nth-child(4) .fab-sec{transition-delay:.16s}
.fab-row:nth-child(5) .fab-sec{transition-delay:.20s}
.fab-row:nth-child(6) .fab-sec{transition-delay:.24s}
.fab-row:nth-child(7) .fab-sec{transition-delay:.28s}

/* FLOATING ISLAND PANELS — NO BACKDROP BLUR */
#backdrop{display:none}

#sim-sheet{
  position:fixed;bottom:20px;left:50%;z-index:300;
  width:calc(100% - 40px);max-width:480px;max-height:70vh;
  background:var(--bg-panel);border:1px solid var(--border);
  border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);
  transform:translateX(-50%) translateY(calc(100% + 40px));
  transition:transform .35s cubic-bezier(.32,1,.32,1);
  display:flex;flex-direction:column;overflow:hidden;
}
#sim-sheet.open{transform:translateX(-50%) translateY(0)}
.sh-handle-wrap{display:flex;justify-content:center;padding:12px 0 4px;flex-shrink:0}
.sh-handle{width:40px;height:4px;background:rgba(255,255,255,.15);border-radius:2px}
.sh-header{display:flex;align-items:center;justify-content:space-between;padding:8px 28px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.sh-title{font-family:var(--mono);font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:.15em}
.sh-close{width:var(--touch-sm);height:var(--touch-sm);border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.sh-close:active{background:rgba(255,255,255,.07)}
#sim-grid{padding:16px 20px 36px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1}
#sim-grid::-webkit-scrollbar{width:4px}
#sim-grid::-webkit-scrollbar-thumb{background:rgba(99,202,255,.2);border-radius:2px}
.grid-sec-label{font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.2em;padding:12px 4px 6px}
.sim-tile{display:flex;align-items:center;gap:16px;min-height:var(--touch-md);padding:12px 18px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;border-left:3px solid transparent;transition:all .18s;text-align:left;width:100%;-webkit-tap-highlight-color:transparent}
.sim-tile:active{background:rgba(255,255,255,.06)}
.sim-tile.active{background:rgba(99,202,255,.07);border-left-color:var(--cyan);border-color:rgba(99,202,255,.15)}
.st-icon{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sim-tile.active .st-icon{background:rgba(99,202,255,.15);border-color:rgba(99,202,255,.3)}
.st-name{font-family:var(--ui);font-size:15px;font-weight:600;color:var(--text);display:block;margin-bottom:2px}
.sim-tile.active .st-name{color:var(--cyan)}
.st-formula{font-family:var(--mono);font-size:10px;color:var(--dim)}
.sim-tile.active .st-formula{color:rgba(99,202,255,.5)}
.st-check{width:22px;height:22px;border-radius:50%;background:var(--cyan);display:none;align-items:center;justify-content:center;font-size:11px;color:#000;font-weight:700;flex-shrink:0}
.sim-tile.active .st-check{display:flex}

/* FLOATING DRAWERS */
.drawer{
  position:fixed;top:50%;z-index:300;
  background:var(--bg-panel);
  display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  transition:transform .35s cubic-bezier(.32,1,.32,1);
}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:var(--topbar-h);border-bottom:1px solid var(--border);flex-shrink:0;border-radius:20px 20px 0 0}
.drawer-ttl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.15em}
.drawer-x{width:var(--touch-sm);height:var(--touch-sm);border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.drawer-x:active{background:rgba(255,255,255,.07)}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-body::-webkit-scrollbar{width:4px}
.drawer-body::-webkit-scrollbar-thumb{border-radius:2px}

#ctrl-drawer{right:20px;width:340px;max-height:75vh;transform:translateY(-50%) translateX(calc(100% + 40px))}
#ctrl-drawer.open{transform:translateY(-50%) translateX(0)}
#ctrl-drawer .drawer-ttl{color:var(--cyan)}
#ctrl-drawer .drawer-body::-webkit-scrollbar-thumb{background:rgba(99,202,255,.2)}

#info-drawer{left:20px;width:380px;max-height:75vh;transform:translateY(-50%) translateX(calc(-100% - 40px))}
#info-drawer.open{transform:translateY(-50%) translateX(0)}
#info-drawer .drawer-ttl{color:var(--lime)}
#info-drawer .drawer-body::-webkit-scrollbar-thumb{background:rgba(168,255,120,.2)}

/* GUI */
#gui-container{position:static!important}
.lil-gui{--background-color:transparent!important;--text-color:#e8f0fe!important;--title-background-color:rgba(99,202,255,.06)!important;--title-text-color:#63caff!important;--widget-color:rgba(255,255,255,0.08)!important;--hover-color:rgba(255,255,255,0.13)!important;--focus-color:rgba(99,202,255,.25)!important;--number-color:#a8ff78!important;--string-color:#ff9f45!important;--font-family:'Syne',sans-serif!important;--font-size:14px!important;width:100%!important;max-height:none!important;overflow-y:visible!important;border:none!important;border-radius:0!important;box-shadow:none!important}
.lil-gui .controller{height:36px!important;margin-bottom:4px!important}
.lil-gui .title{height:44px!important;line-height:44px!important;font-weight:700!important;font-family:'Space Mono',monospace!important;font-size:12px!important;letter-spacing:.05em!important;border-radius:var(--radius-sm)!important;margin-bottom:4px!important}

/* ANALYSIS */
.an-sim-name{font-family:var(--mono);font-size:10px;color:var(--lime);text-transform:uppercase;letter-spacing:.15em;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.overlay-body{font-size:14px;line-height:1.75;color:var(--muted);margin-bottom:14px}
.formula-block{background:rgba(99,202,255,.07);border-left:3px solid var(--cyan);padding:14px 18px;margin:10px 0;font-family:var(--mono);font-size:12px;color:#dce8f8;border-radius:0 var(--radius-sm) var(--radius-sm) 0;line-height:1.9}
.formula-label{display:block;font-size:9px;color:var(--lime);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
#live-values{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.live-chip{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:100px;padding:7px 16px;font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:8px}
.live-chip span{color:var(--lime);font-weight:700}
.energy-section-title{font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin:18px 0 10px}
.energy-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.energy-label{width:30px;font-family:var(--mono);font-size:11px;font-weight:700;text-align:center}
.energy-track{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.energy-fill{height:100%;width:0%;border-radius:4px;transition:width .08s linear}
.energy-val{width:60px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--muted)}

/* STUDENT MODE */
body.student-mode #fab-cluster{opacity:0;pointer-events:none;transition:opacity .4s}
body.student-mode #fr-viewmode{display:none!important}
#student-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:90;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;display:none;animation:float 3s ease-in-out infinite}
body.student-mode #student-hint{display:block}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}

#transition-overlay{position:absolute;inset:0;background:var(--bg-deep);z-index:500;opacity:0;pointer-events:none;transition:opacity .35s ease}
#transition-overlay.active{opacity:1;pointer-events:all}

#loading-screen{position:fixed;inset:0;background:var(--bg-deep);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .5s}
#loading-screen.fade-out{opacity:0;pointer-events:none}
.ls-logo{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--cyan);letter-spacing:6px}
.ls-tag{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:3px}
.ls-track{width:180px;height:2px;background:rgba(255,255,255,.1);border-radius:1px;overflow:hidden}
.ls-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:1px;animation:lsw 1.2s ease-in-out forwards}
@keyframes lsw{from{width:0}to{width:100%}}

/* ==========================================================
   ROPE-RESKIN-2026
   Visual layer only — existing simulation logic is retained.
   ========================================================== */

:root {
  --bg-deep: #0b0b10;
  --bg-panel: rgba(20, 20, 29, 0.98);
  --border: rgba(205, 202, 230, 0.13);
  --border-hi: rgba(180, 165, 245, 0.38);
  --cyan: #b4a5f5;
  --lime: #bdcba8;
  --orange: #e4ad83;
  --purple: #b4a5f5;
  --text: #f1eff8;
  --muted: rgba(241, 239, 248, 0.70);
  --dim: rgba(241, 239, 248, 0.43);
  --radius: 16px;
  --radius-sm: 11px;
}

html, body {
  background: #0b0b10;
  color: var(--text);
  font-family: "Syne", system-ui, sans-serif;
}

button, input, select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid #b4a5f5;
  outline-offset: 3px;
}

#app {
  background:
    radial-gradient(ellipse at 50% 42%, rgba(91, 78, 135, 0.10), transparent 56%),
    #0b0b10;
}

#canvas-container {
  background: transparent;
}

/* Header: quiet, readable, and more like a scientific instrument. */
#top-bar {
  min-height: 76px;
  padding: 0 clamp(16px, 3vw, 38px);
  gap: 16px;
  background: linear-gradient(
    180deg,
    rgba(11, 11, 16, 0.98) 0%,
    rgba(11, 11, 16, 0.82) 70%,
    transparent 100%
  );
}

.tb-logo {
  color: #c4b8ff;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.tb-dot {
  width: 8px;
  height: 8px;
  background: #b9c9a3;
  box-shadow: 0 0 0 4px rgba(185, 201, 163, 0.10);
  animation: none;
}

.tb-div {
  background: rgba(205, 202, 230, 0.18);
}

#sim-title {
  font-family: "Syne", system-ui, sans-serif;
  font-size: clamp(16px, 1.5vw, 21px);
  font-weight: 700;
  letter-spacing: -0.025em;
}

#sim-subtitle {
  font-size: 11px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.035);
  border-color: var(--border);
}

#view-badge,
#mode-badge {
  font-size: 11px;
  letter-spacing: 0.07em;
  border-radius: 10px;
}

#view-badge {
  color: #d1c8ff;
  background: rgba(180, 165, 245, 0.11);
  border-color: rgba(180, 165, 245, 0.24);
}

#view-badge.mode-3d {
  color: #d1c8ff;
  background: rgba(180, 165, 245, 0.16);
  border-color: rgba(180, 165, 245, 0.36);
}

#mode-badge {
  min-height: 44px;
  padding: 9px 15px;
  background: rgba(255, 255, 255, 0.045);
  border-color: var(--border);
  color: var(--muted);
}

#mode-badge.student {
  color: #d1dcbf;
  background: rgba(185, 201, 163, 0.10);
  border-color: rgba(185, 201, 163, 0.27);
}

/* Main actions: clear controls, generous touch targets. */
#fab-cluster {
  right: clamp(14px, 2.5vw, 30px);
  bottom: clamp(16px, 2.5vh, 28px);
  gap: 11px;
}

.fab {
  box-shadow: 0 5px 22px rgba(0, 0, 0, 0.28);
}

.fab-main {
  background: #c0b3fb;
  color: #171321;
  box-shadow: 0 7px 24px rgba(0, 0, 0, 0.35);
}

.fab-main.open {
  background: #242132;
  color: #d3caff;
  border-color: #b4a5f5;
  box-shadow: 0 0 0 4px rgba(180, 165, 245, 0.09);
}

.fab-sec {
  background: rgba(25, 25, 35, 0.98);
  color: #e2dfed;
  border-color: rgba(205, 202, 230, 0.17);
}

.fab-sec.on {
  background: rgba(180, 165, 245, 0.13);
  color: #d1c8ff;
  border-color: rgba(180, 165, 245, 0.40);
}

.fab-sec.paused {
  background: rgba(228, 173, 131, 0.12);
  color: #f0c4a1;
  border-color: rgba(228, 173, 131, 0.36);
}

.fab-sec.ghost-on {
  background: rgba(185, 201, 163, 0.12);
  color: #d0ddb9;
  border-color: rgba(185, 201, 163, 0.36);
}

.fab-lbl {
  color: #e6e3f0;
  background: rgba(24, 24, 34, 0.98);
  border-color: var(--border);
  font-size: 11px;
}

/* Experiment picker. */
#sim-sheet {
  background: rgba(19, 19, 28, 0.99);
  border-color: rgba(205, 202, 230, 0.17);
  border-radius: 18px;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.52);
}

.sh-header {
  padding: 12px 20px;
}

.sh-title {
  color: #c4b8ff;
  font-size: 12px;
  letter-spacing: 0.10em;
}

.sh-close {
  border-radius: 12px;
  color: var(--text);
}

#sim-grid {
  gap: 9px;
  padding: 14px 16px 24px;
}

.grid-sec-label {
  color: #aaa4c0;
  font-size: 10px;
  letter-spacing: 0.12em;
}

.sim-tile {
  min-height: 68px;
  gap: 13px;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(205, 202, 230, 0.12);
  border-left: 3px solid transparent;
  border-radius: 12px;
}

.sim-tile:hover {
  background: rgba(255, 255, 255, 0.045);
  border-color: rgba(205, 202, 230, 0.22);
}

.sim-tile.active {
  background: rgba(180, 165, 245, 0.085);
  border-color: rgba(180, 165, 245, 0.28);
  border-left-color: #b4a5f5;
}

.st-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  border-color: var(--border);
}

.sim-tile.active .st-icon {
  background: rgba(180, 165, 245, 0.13);
  border-color: rgba(180, 165, 245, 0.30);
}

.st-name {
  font-size: 15px;
  font-weight: 700;
}

.sim-tile.active .st-name {
  color: #d0c7ff;
}

.st-formula {
  color: #aaa4bd;
  font-size: 11px;
}

.sim-tile.active .st-formula {
  color: #c3b8ef;
}

.st-check {
  background: #c0b3fb;
  color: #171321;
}

/* Drawers and analysis panels. */
.drawer {
  background: rgba(19, 19, 28, 0.99);
  border-color: rgba(205, 202, 230, 0.16);
  border-radius: 17px;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.50);
}

.drawer-hdr {
  min-height: 68px;
  height: 68px;
  padding: 0 18px;
  border-bottom-color: var(--border);
}

.drawer-ttl {
  font-size: 12px;
  letter-spacing: 0.09em;
}

.drawer-x {
  border-radius: 12px;
  color: var(--text);
}

.drawer-body {
  padding: 18px;
}

#ctrl-drawer .drawer-ttl {
  color: #c4b8ff;
}

#info-drawer .drawer-ttl {
  color: #c4d2ad;
}

#ctrl-drawer .drawer-body::-webkit-scrollbar-thumb {
  background: rgba(180, 165, 245, 0.32);
}

#info-drawer .drawer-body::-webkit-scrollbar-thumb {
  background: rgba(185, 201, 163, 0.30);
}

/* Existing dynamically generated lil-gui controls. */
#gui-container {
  color: var(--text);
}

.lil-gui {
  --background-color: transparent !important;
  --text-color: #f1eff8 !important;
  --title-background-color: rgba(180, 165, 245, 0.10) !important;
  --title-text-color: #c4b8ff !important;
  --widget-color: rgba(255, 255, 255, 0.07) !important;
  --hover-color: rgba(255, 255, 255, 0.12) !important;
  --focus-color: rgba(180, 165, 245, 0.24) !important;
  --number-color: #c4b8ff !important;
  --string-color: #e4ad83 !important;
  --font-family: "Syne", system-ui, sans-serif !important;
  --font-size: 14px !important;
}

.lil-gui .title {
  font-weight: 700;
}

.lil-gui input {
  accent-color: #b4a5f5;
}

/* Loading screen and pause state. */
#loading-screen {
  background: #0b0b10;
}

.ls-logo {
  color: #c4b8ff;
  font-family: "Syne", system-ui, sans-serif;
  font-size: clamp(36px, 7vw, 54px);
  font-weight: 800;
  letter-spacing: 0.12em;
}

.rope-mark {
  color: #c4c0d4;
  font-size: 0.28em;
  font-weight: 600;
  letter-spacing: 0.16em;
  vertical-align: middle;
}

.ls-fill {
  background: #b4a5f5;
}

.ls-tag {
  color: #b8b2ca;
  font-size: 11px;
  letter-spacing: 0.12em;
}

#pause-indicator {
  background: #e4ad83;
  color: #1c1510;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
}

/* Respect reduced-motion settings. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

/* Tablet and phone layouts. */
@media (max-width: 760px) {
  :root {
    --topbar-h: 64px;
    --touch-sm: 48px;
    --touch-md: 56px;
    --touch-lg: 62px;
  }

  #top-bar {
    height: 64px;
    padding: 0 13px;
    gap: 9px;
  }

  .tb-logo {
    font-size: 14px;
    letter-spacing: 0.08em;
    gap: 7px;
  }

  .tb-div {
    height: 23px;
  }

  #sim-title {
    font-size: 14px;
    line-height: 1.2;
  }

  #sim-subtitle {
    display: none;
  }

  #view-badge {
    padding: 5px 8px;
    font-size: 10px;
  }

  #mode-badge {
    gap: 5px;
    padding: 7px 9px;
    min-height: 40px;
    font-size: 10px;
  }

  #fab-cluster {
    right: 13px;
    bottom: 14px;
    gap: 8px;
  }

  .fab-row {
    gap: 8px;
  }

  .fab-lbl {
    font-size: 10px;
    padding: 5px 9px;
  }

  #sim-sheet {
    bottom: 10px;
    width: calc(100% - 20px);
    max-height: 78dvh;
    border-radius: 16px;
  }

  #sim-grid {
    padding: 10px 12px 20px;
  }

  .sim-tile {
    min-height: 60px;
    padding: 9px 11px;
    gap: 10px;
  }

  .st-icon {
    width: 40px;
    height: 40px;
  }

  .st-name {
    font-size: 14px;
  }

  .st-formula {
    font-size: 10px;
  }

  .drawer {
    top: auto;
    bottom: 10px;
    max-height: min(76dvh, 620px);
    border-radius: 16px;
  }

  #ctrl-drawer,
  #info-drawer {
    left: 10px;
    right: 10px;
    width: auto;
    transform: translateY(calc(100% + 30px));
  }

  #ctrl-drawer.open,
  #info-drawer.open {
    transform: translateY(0);
  }

  .drawer-hdr {
    height: 58px;
    min-height: 58px;
  }

  .drawer-body {
    padding: 14px;
  }
}

@media (max-width: 420px) {
  #top-bar {
    gap: 7px;
    padding: 0 9px;
  }

  .tb-logo {
    font-size: 12px;
    gap: 5px;
  }

  .tb-dot {
    width: 6px;
    height: 6px;
  }

  #sim-title {
    max-width: 34vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #mode-badge {
    padding: 6px 7px;
    font-size: 9px;
  }
}

</style>
</head>
<body>

<div id="loading-screen">
  <div class="ls-logo">ROPE<span class="rope-mark"> / LAB</span></div>
  <div class="ls-track"><div class="ls-fill"></div></div>
  <div class="ls-tag">See Physics. Understand Reality.</div>
</div>

<div id="info-overlay" class="hidden" style="display:none;"></div>
<canvas id="bg-particles"></canvas>

<div id="app">
  <div id="canvas-container"></div>

  <div id="top-bar">
    <div class="tb-logo"><div class="tb-dot"></div>ROPE</div>
    <div class="tb-div"></div>
    <div id="sim-title">—</div>
    <div id="sim-subtitle">—</div>
    <div id="view-badge">2D</div>
    <div id="mode-badge" onclick="toggleStudentMode()" class="rh">
      <span id="mode-icon">👨‍🏫</span>
      <span id="mode-label">Teacher</span>
    </div>
  </div>

  <div id="pause-indicator">⏸ PAUSED</div>
  <div id="student-hint">● Touch the board to explore</div>
  <div id="backdrop" onclick="closeAll()"></div>

  <div id="sim-sheet">
    <div class="sh-handle-wrap"><div class="sh-handle"></div></div>
    <div class="sh-header">
      <div class="sh-title">Select Simulation</div>
      <button class="sh-close rh" onclick="closeSheet()">✕</button>
    </div>
    <div id="sim-grid"></div>
  </div>

  <div id="ctrl-drawer" class="drawer">
    <div class="drawer-hdr">
      <div class="drawer-ttl">⚙ Sim Controls</div>
      <button class="drawer-x rh" onclick="closeCtrl()">✕</button>
    </div>
    <div class="drawer-body" id="ctrl-drawer-body">
      <div id="gui-container"></div>
    </div>
  </div>

  <div id="info-drawer" class="drawer">
    <div class="drawer-hdr">
      <div class="drawer-ttl">📐 Physics Analysis</div>
      <button class="drawer-x rh" onclick="closeAnalysis()">✕</button>
    </div>
    <div class="drawer-body" id="info-drawer-body">
      <div class="an-sim-name" id="overlay-sim-badge">—</div>
      <div class="overlay-body" id="overlay-text"></div>
      <div id="formula-container"></div>
      <div id="energy-container" style="display:none"></div>
      <div id="momentum-container" style="display:none"></div>
      <div id="live-values"></div>
    </div>
  </div>

  <div id="fab-cluster">
    <div class="fab-row" id="fr-sims"><span class="fab-lbl">Simulations</span><button class="fab fab-sec rh" id="fab-sims" onclick="openSheet()">🧪</button></div>
    <div class="fab-row" id="fr-analysis"><span class="fab-lbl">Analysis</span><button class="fab fab-sec rh" id="fab-analysis" onclick="toggleAnalysis()">📐</button></div>
    <div class="fab-row" id="fr-ctrl"><span class="fab-lbl">Controls</span><button class="fab fab-sec rh" id="fab-ctrl" onclick="toggleCtrl()">⚙</button></div>
    <div class="fab-row" id="fr-ghost"><span class="fab-lbl">Ghost Trail</span><button class="fab fab-sec rh" id="fab-ghost" onclick="toggleGhost()">👻</button></div>
    <div class="fab-row" id="fr-viewmode"><span class="fab-lbl" id="vm-label">Switch to 3D</span><button class="fab fab-sec rh" id="fab-viewmode" onclick="toggleViewMode()">🔲</button></div>
    <div class="fab-row" id="fr-reset"><span class="fab-lbl">Reset</span><button class="fab fab-sec rh" id="fab-reset" onclick="resetSim()">↺</button></div>
    <div class="fab-row" id="fr-pause"><span class="fab-lbl">Pause / Resume</span><button class="fab fab-sec rh" id="fab-pause" onclick="pauseSim()">⏸</button></div>
    <button class="fab fab-main rh" id="fab-main" onclick="toggleFabMenu()">☰</button>
  </div>

  <div id="transition-overlay"></div>
</div>

<script>
document.addEventListener('pointerdown', function(e) {
  var h = e.target.closest('.rh'); if (!h) return;
  var r = document.createElement('span');
  var rect = h.getBoundingClientRect();
  var sz = Math.max(rect.width, rect.height);
  r.className = 'ripple';
  r.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-rect.left-sz/2)+'px;top:'+(e.clientY-rect.top-sz/2)+'px';
  h.appendChild(r);
  r.addEventListener('animationend', function(){r.remove()});
});

var _fabOpen=false, _ctrlOpen=false, _analysisOpen=false, _studentMode=false;

function toggleFabMenu() {
  _fabOpen=!_fabOpen; var btn=document.getElementById('fab-main');
  btn.textContent=_fabOpen?'✕':'☰'; btn.classList.toggle('open',_fabOpen);
  document.querySelectorAll('.fab-sec').forEach(function(f){f.classList.toggle('vis',_fabOpen)});
  document.querySelectorAll('.fab-row').forEach(function(r){r.classList.toggle('vis',_fabOpen)});
}
function openSheet(){document.getElementById('sim-sheet').classList.add('open')}
function closeSheet(){document.getElementById('sim-sheet').classList.remove('open')}
function toggleCtrl(){
  _ctrlOpen=!_ctrlOpen;
  document.getElementById('ctrl-drawer').classList.toggle('open',_ctrlOpen);
  document.getElementById('fab-ctrl').classList.toggle('on',_ctrlOpen);
  if(_ctrlOpen&&_analysisOpen){_analysisOpen=false;document.getElementById('info-drawer').classList.remove('open');document.getElementById('fab-analysis').classList.remove('on')}
}
function closeCtrl(){_ctrlOpen=false;document.getElementById('ctrl-drawer').classList.remove('open');document.getElementById('fab-ctrl').classList.remove('on')}
function toggleAnalysis(){
  _analysisOpen=!_analysisOpen;
  document.getElementById('info-drawer').classList.toggle('open',_analysisOpen);
  document.getElementById('fab-analysis').classList.toggle('on',_analysisOpen);
  if(_analysisOpen&&_ctrlOpen){_ctrlOpen=false;document.getElementById('ctrl-drawer').classList.remove('open');document.getElementById('fab-ctrl').classList.remove('on')}
}
function closeAnalysis(){_analysisOpen=false;document.getElementById('info-drawer').classList.remove('open');document.getElementById('fab-analysis').classList.remove('on')}
function closeAll(){closeSheet();closeCtrl();closeAnalysis()}

function pauseSim(){
  if(window._engine&&window._engine.activeSim){
    window._engine.activeSim.togglePause(); var p=window._engine.activeSim._paused; var btn=document.getElementById('fab-pause');
    btn.classList.toggle('paused',p); btn.textContent=p?'▶':'⏸';
  }
}
function resetSim(){
  if(window._engine&&window._engine.activeSim){
    if(window._engine.activeSim.reset) window._engine.activeSim.reset();
    if(window._engine.activeSim._paused) pauseSim();
  }
  var btn=document.getElementById('fab-reset');btn.style.background='rgba(168,255,120,.2)';btn.style.color='#a8ff78';
  setTimeout(function(){btn.style.background='';btn.style.color=''},300);
}

function toggleGhost(){
  window._ghostEnabled=!window._ghostEnabled;
  document.getElementById('fab-ghost').classList.toggle('ghost-on',window._ghostEnabled);
}

function toggleViewMode(){
  if(!window._engine) return;
  var next = window._engine.viewMode==='2d'?'3d':'2d';
  window._engine.setViewMode(next);
  updateViewModeUI();
}
function updateViewModeUI(){
  var m = window._engine?window._engine.viewMode:'2d';
  document.getElementById('view-badge').textContent=m.toUpperCase();
  document.getElementById('view-badge').className=m==='3d'?'mode-3d':'';
  document.getElementById('vm-label').textContent=m==='2d'?'Switch to 3D':'Switch to 2D';
  document.getElementById('fab-viewmode').textContent=m==='2d'?'🔲':'🎲';
}

function toggleStudentMode(){
  _studentMode=!_studentMode;
  document.body.classList.toggle('student-mode',_studentMode);
  document.getElementById('mode-label').textContent=_studentMode?'Student':'Teacher';
  document.getElementById('mode-icon').textContent=_studentMode?'👨‍🎓':'👨‍🏫';
  document.getElementById('mode-badge').classList.toggle('student',_studentMode);
  if(_studentMode){
    closeAll(); if(_fabOpen) toggleFabMenu();
    if(window._engine&&window._engine.viewMode!=='2d'){window._engine.setViewMode('2d'); updateViewModeUI();}
  }
}

window.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();pauseSim()}
  else if(e.key==='r'||e.key==='R'){e.preventDefault();resetSim()}
  else if(e.key==='h'||e.key==='H'){toggleAnalysis()}
  else if(e.key==='c'||e.key==='C'){toggleCtrl()}
  else if(e.key==='s'||e.key==='S'){openSheet()}
  else if(e.key==='g'||e.key==='G'){toggleGhost()}
  else if(e.key==='Escape'){closeAll()}
});
window.toggleOverlay=toggleAnalysis;
</script>

<script src="engine.js"></script>
<script src="bg.js"></script>
<script src="sims/wave.js"></script>
<script src="sims/shm.js"></script>
<script src="sims/projectile.js"></script>
<script src="sims/pendulum.js"></script>
<script src="sims/circular.js"></script>
<script src="sims/collision.js"></script>
<script src="sims/gravity.js"></script>
<script src="sim-registry.js"></script>
</body>
</html>
